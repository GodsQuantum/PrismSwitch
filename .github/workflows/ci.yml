name: Linux checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Rust formatting and warnings
        run: |
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets
      - name: Rust unit and rollback tests
        run: cargo test --locked
      - name: Shell scripts
        run: shellcheck build.sh install.sh uninstall.sh
      - name: Native release build
        run: |
          ./build.sh
          (cd target/release && sha256sum -c SHA256SUMS)
          target/release/prismswitch --version
          target/release/prismswitch validate
          target/release/prismswitch keyd-config
