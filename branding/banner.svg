<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">PrismSwitch</title>
  <desc id="desc">Two sources converge through a switch into a vintage desktop display.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1">
      <stop stop-color="#0B1622"/><stop offset="1" stop-color="#14283A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#AFC5C7" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#back)"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <rect x="56" y="54" width="192" height="32" rx="16" fill="#223D4B"/>
  <text x="152" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="650" letter-spacing="1.7" fill="#58D6C5">LINUX DISPLAY UTILITY</text>
  <text x="56" y="183" font-family="system-ui, sans-serif" font-size="83" letter-spacing="-3" font-weight="750" fill="#EAF8F5">Prism<tspan fill="#58D6C5">Switch</tspan></text>
  <text x="61" y="234" font-family="system-ui, sans-serif" font-size="31" fill="#AFC5C7">Two inputs. One screen.</text>
  <text x="62" y="280" font-family="system-ui, sans-serif" font-size="18" fill="#AFC5C7">Target Display Mode  /  Custom hotkeys  /  Eco profiles</text>
  <rect x="60" y="321" width="138" height="34" rx="8" fill="#14283A" stroke="#58D6C5"/>
  <text x="129" y="344" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle" fill="#58D6C5">Ctrl + Alt + M</text>
  <rect x="211" y="321" width="138" height="34" rx="8" fill="#14283A" stroke="#A9A3FF"/>
  <text x="280" y="344" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle" fill="#A9A3FF">Ctrl + Alt + E</text>
  <g transform="translate(737 62)">
    <rect x="0" y="0" width="390" height="253" rx="18" fill="#0B1622" stroke="#AFC5C7" stroke-width="5"/>
    <rect x="18" y="18" width="354" height="217" rx="8" fill="#14283A"/>
    <path d="M28 69H112L195 126" stroke="#58D6C5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M28 183H112L195 126" stroke="#A9A3FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M195 126H354" stroke="#EAF8F5" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M195 89L232 126 195 163 158 126Z" fill="#58D6C5" stroke="#0B1622" stroke-width="5"/>
    <path d="M195 253V282M155 282H235" stroke="#AFC5C7" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
